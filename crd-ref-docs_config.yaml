processor:
  maxDepth: 176
  ignoreGroupVersions:
    - "GVK"
  ignoreTypes:
    - '\bConfig\b'
    - "CtxValueKey"
    - "Embedded[2-4]$"
    - "ParsedLab"
    - "SetOwnerFuncType"
    - '\bSystem\b'
    - '\bCloudInitNetworkConfig\b'
    - '\bCloudInitNetworkConfigBody\b'
    - '\bNicConfig\b'
    - '\bNicMatcher\b'
  ignoreFields:
    - "status$"
    - "TypeMeta$"
    - "NoUserInput$"
  customMarkers:
    - name: "nodoc"
      target: field
    - name: "hidefromdoc"
      target: type


render:
  kubernetesVersion: 1.25
  knownTypes:
    - name: Probe
      package: kubevirt.io/api/core/v1
      link: https://kubevirt.io/api-reference/v1.6.2/definitions.html#_v1_probe
